url: https://jbengler.github.io/tidylayouts/
template:
  bootstrap: 5

authors:
  Jan Broder Engler:
    href: https://github.com/jbengler

figures:
  dpi: 200

reference:
- title: Create
  desc: >
    To create a layout, first assign your plots to variables such as `p1`, `p2`, and `p3`.
    Then, define a base layout and progressively expand and adjust it.
    Plots are aligned by their panels.
- contents:
  - new_row
  - layout_plots
- title: Size and margins
  desc: >
    Panel sizes are fixed with `set_size()`, or decided by the layout with `auto_width()`
    and `auto_height()`. `auto_margins()` centers a plot in the spare space next to it.
- contents:
  - auto_width
- title: Adjust
  desc: >
    Options for the whole figure.
- contents:
  - starts_with("layout_s")
  - tag_group
- title: Save
- contents:
  - save_layout
- title: Placeholders
- contents:
  - dummy
